name: Update profile statistics

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PROFILE_REPOSITORY: ${{ github.repository }}
      PROFILE_SCRIPT_REF: ${{ github.sha }}
    steps:
      - name: Generate and publish repository-hosted SVG cards
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$PROFILE_REPOSITORY/contents/scripts/update-profile-stats.cjs?ref=$PROFILE_SCRIPT_REF" \
            --header 'Accept: application/vnd.github.raw+json' | node - --publish
